networks:
  default:
    driver: bridge

services:
  be:
    image: mapletool-be
    build:
      context: backend
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JASYPT_PASSWORD: ${JASYPT_PASSWORD:?error}
      GRAFANA_PASSWORD: ${GRAFANA_PASSWORD:?error}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
